<script>
(function () {
  'use strict';

  // ---------- Estado ----------
  const estado = {
    dados: [], periodo: 'mes', ref: new Date(), campo: 'da',
    cliente: '', busca: '', nivel: 2, ordem: { col: 'data', dir: -1 }, graficos: {}
  };
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtData = ms => ms ? new Date(ms).toLocaleDateString('pt-BR') : '';
  const fmtDataHora = ms => ms ? new Date(ms).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const media = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  const fmtMedia = v => v == null ? '–' : v.toFixed(1).replace('.', ',');
  const classeNota = n => n == null ? '' : n >= 9 ? 'boa' : n >= 7 ? 'media' : 'baixa';
  const resolvido = c => c.st === 'Resolvido';
  const cancelado = c => /cancelad/i.test(c.st);
  const emAberto = c => !resolvido(c) && !cancelado(c);
  const classeStatus = st => st === 'Resolvido' ? 'Resolvido' : /cancelad/i.test(st) ? 'Cancelado' : 'Aberto';
  const nivelAssunto = (as, n) => as ? as.split(' - ').slice(0, n).join(' - ') : '(sem assunto)';
  // ---------- Tema (claro/escuro) ----------
  const raiz = document.documentElement;
  const temaSistemaEscuro = () => !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const temaEscuro = () => raiz.dataset.theme ? raiz.dataset.theme === 'dark' : temaSistemaEscuro();
  const COR = { ouro: '#f0c21e', cinza: '#b3bac5', folha: '#8fb04a' };
  const svg_ = d => '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
  const ICONE_SOL = svg_('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>');
  const ICONE_LUA = svg_('<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>');
  function aplicarTema(tema) {
    if (tema) raiz.dataset.theme = tema; else delete raiz.dataset.theme;
    COR.verde = temaEscuro() ? '#4f9a5a' : '#1f4d2b';
    // No escuro mostra o sol (ir para o claro); no claro, a lua
    const b = $('#btn-tema');
    b.innerHTML = temaEscuro() ? ICONE_SOL : ICONE_LUA;
    b.title = temaEscuro() ? 'Mudar para tema claro' : 'Mudar para tema escuro';
    b.setAttribute('aria-label', b.title);
  }
  let temaSalvo = null; try { temaSalvo = localStorage.getItem('painel.tema'); } catch (e) { /* sem storage */ }
  aplicarTema(temaSalvo);
  const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  // Backend: Apps Script ou dados de exemplo quando aberto fora do Google
  const noGoogle = typeof google !== 'undefined' && google.script && google.script.run;
  function chamar(fn, ...args) {
    return new Promise((ok, erro) => {
      if (!noGoogle) return ok(window.MOCK[fn](...args));
      google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](...args);
    });
  }

  // ---------- Período ----------
  // Enquanto o ano é digitado o input já reporta datas como 0002-..., 0020-...; só aceita anos plausíveis
  function dataCompleta(v) {
    const ano = Number(String(v).slice(0, 4));
    return !!v && ano >= 2000 && ano <= 2100;
  }
  function deslocar(ref, delta) {
    const r = new Date(ref);
    if (estado.periodo === 'dia') r.setDate(r.getDate() + delta);
    if (estado.periodo === 'semana') r.setDate(r.getDate() + 7 * delta);
    if (estado.periodo === 'mes') r.setMonth(r.getMonth() + delta, 1);
    if (estado.periodo === 'ano') r.setFullYear(r.getFullYear() + delta);
    return r;
  }

  // desloc = -1 devolve o período anterior (ou null quando não existe)
  function intervalo(desloc = 0) {
    const r = deslocar(estado.ref, desloc); r.setHours(0, 0, 0, 0);
    if (desloc && ['tudo', 'custom'].includes(estado.periodo)) return null;
    let ini, fim;
    switch (estado.periodo) {
      case 'dia': ini = r; fim = new Date(r); fim.setDate(fim.getDate() + 1); break;
      case 'semana': {
        ini = new Date(r); ini.setDate(r.getDate() - ((r.getDay() + 6) % 7));
        fim = new Date(ini); fim.setDate(ini.getDate() + 7); break;
      }
      case 'mes': ini = new Date(r.getFullYear(), r.getMonth(), 1); fim = new Date(r.getFullYear(), r.getMonth() + 1, 1); break;
      case 'ano': ini = new Date(r.getFullYear(), 0, 1); fim = new Date(r.getFullYear() + 1, 0, 1); break;
      case 'custom': {
        const a = $('#dt-ini').value, b = $('#dt-fim').value;
        ini = dataCompleta(a) ? new Date(a + 'T00:00:00') : null;
        fim = dataCompleta(b) ? new Date(b + 'T00:00:00') : null;
        if (fim) fim.setDate(fim.getDate() + 1);
        break;
      }
      default: ini = null; fim = null;
    }
    return { ini, fim };
  }

  const maiuscula = t => t.charAt(0).toUpperCase() + t.slice(1);

  // Cabeçalho do período: linha pequena (pre), título e dica com horários
  function rotuloPeriodo({ ini, fim }) {
    const r = estado.ref;
    switch (estado.periodo) {
      case 'dia': return { pre: 'Dia', titulo: maiuscula(r.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' })) };
      case 'semana': { const f = new Date(fim); f.setDate(f.getDate() - 1); return { pre: 'Semana', titulo: fmtData(ini) + ' – ' + fmtData(f) }; }
      case 'mes': return { pre: 'Mês', titulo: maiuscula(r.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' })) };
      case 'ano': return { pre: 'Ano', titulo: String(r.getFullYear()) };
      case 'custom': {
        if (!ini && !fim) return { pre: 'Período personalizado', titulo: 'Escolha as datas' };
        const f = fim ? new Date(fim.getTime() - 864e5) : null;
        return { pre: 'Período personalizado', titulo: (ini ? fmtData(ini) : 'início') + ' – ' + (f ? fmtData(f) : 'hoje') };
      }
      default: return { pre: 'Período', titulo: 'Todo o histórico' };
    }
  }

  // Nome do período anterior, usado na comparação dos números
  function nomeAnterior() {
    return { dia: 'dia anterior', semana: 'semana anterior', mes: 'mês anterior', ano: 'ano anterior' }[estado.periodo];
  }

  function mover(delta) {
    estado.ref = deslocar(estado.ref, delta); render();
  }

  // Data de referência do chamado conforme o campo escolhido (com alternativas se vazio)
  function dataRef(c) {
    if (estado.campo === 'dv') return c.dv;
    if (estado.campo === 'dr') return c.dr || null;
    return c.da || c.dr || c.dv;
  }

  function filtrar(iv = intervalo()) {
    const { ini, fim } = iv;
    const cli = estado.cliente.trim().toLowerCase();
    const q = estado.busca.trim().toLowerCase();
    return estado.dados.filter(c => {
      const d = dataRef(c);
      if (!d) return false;
      if (ini && d < ini.getTime()) return false;
      if (fim && d >= fim.getTime()) return false;
      if (cli && c.cl.toLowerCase() !== cli) return false;
      if (q && ![c.n, c.as, c.so, c.cl, c.op, c.gr, c.co].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
  }

  // ---------- Render ----------
  function render() {
    const iv = intervalo();
    const rot = rotuloPeriodo(iv);
    $('#pre-periodo').textContent = rot.pre;
    $('#rotulo-periodo').textContent = rot.titulo;
    $('#nav-periodo').hidden = ['tudo', 'custom'].includes(estado.periodo);
    $('#custom').hidden = estado.periodo !== 'custom';
    document.querySelectorAll('#periodos button').forEach(b => b.classList.toggle('ativo', b.dataset.p === estado.periodo));

    const lista = filtrar(iv);
    const ivAnt = intervalo(-1);
    renderKpis(lista, ivAnt ? filtrar(ivAnt) : null);
    renderEvolucao(lista, iv);
    renderBarras('r-clientes', contar(lista, c => c.cl || '(sem cliente)'), 10);
    renderBarras('r-solicitantes', contar(lista, c => c.so ? c.so + (c.cl ? ' · ' + c.cl : '') : '(sem solicitante)'));
    renderBarras('r-classif', contar(lista, c => nivelAssunto(c.as, estado.nivel)));
    renderNotas(lista);
    renderTabelaClientes(lista);
    renderTabelaChamados(lista);
    renderComentarios(lista);
  }

  function contar(lista, chave) {
    const m = {};
    lista.forEach(c => { const k = chave(c); m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  }

  function metricas(lista) {
    const avaliados = lista.filter(c => c.na != null || c.ns != null);
    const comRc = lista.filter(c => c.rc);
    return {
      total: lista.length,
      resolvidos: lista.filter(resolvido).length,
      abertos: lista.filter(emAberto).length,
      cancelados: lista.filter(cancelado).length,
      avaliacoes: avaliados.length,
      na: media(avaliados.map(c => c.na).filter(v => v != null)),
      ns: media(avaliados.map(c => c.ns).filter(v => v != null)),
      rcN: comRc.length,
      rcOk: comRc.filter(c => /^resolvido/i.test(c.rc)).length,
      clientes: new Set(lista.map(c => c.cl).filter(Boolean)).size
    };
  }

  function renderKpis(lista, listaAnt) {
    const m = metricas(lista), a = listaAnt ? metricas(listaAnt) : null, nome = nomeAnterior();
    // Variação percentual (contagens) e absoluta (notas) em relação ao período anterior
    const vPct = (campo, colorir) => {
      if (!a || !a[campo]) return '';
      const p = Math.round(100 * (m[campo] - a[campo]) / a[campo]);
      const cls = !colorir || !p ? '' : p > 0 ? 'up' : 'dn';
      return `<div class="d"><span class="${cls}">${p > 0 ? '+' : p < 0 ? '−' : ''}${Math.abs(p)}%</span> vs. ${nome}</div>`;
    };
    const vNota = campo => {
      if (!a || m[campo] == null || a[campo] == null) return '';
      const d = Math.round(10 * (m[campo] - a[campo])) / 10;
      const cls = d > 0 ? 'up' : d < 0 ? 'dn' : '';
      return `<div class="d"><span class="${cls}">${d > 0 ? '+' : d < 0 ? '−' : ''}${Math.abs(d).toFixed(1).replace('.', ',')}</span> vs. ${nome} (${fmtMedia(a[campo])})</div>`;
    };
    const taxa = m.resolvidos ? Math.round(100 * m.avaliacoes / m.resolvidos) + '% dos resolvidos' : 'nenhum resolvido';
    const rc = m.rcN ? `Resolvido p/ cliente: ${Math.round(100 * m.rcOk / m.rcN)}% (${m.rcOk} de ${m.rcN})` : 'média de 1 a 10';
    const k = [
      ['', 'Chamados', m.total, vPct('total', false) +
        `<div class="d">${m.resolvidos} resolvidos · ${m.abertos} em aberto · ${m.cancelados} cancelados</div><div class="d">${m.clientes} clientes atendidos</div>`],
      ['', 'Avaliações', m.avaliacoes, vPct('avaliacoes', true) + `<div class="d">${taxa}</div>`],
      ['destaque', 'Nota atendimento', fmtMedia(m.na), vNota('na') + `<div class="d">${rc}</div>`],
      ['', 'Nota sistema ERP', fmtMedia(m.ns), vNota('ns') + '<div class="d">média de 1 a 10</div>']
    ];
    $('#kpis').innerHTML = k.map(([cls, l, v, d]) =>
      `<div class="card kpi ${cls}"><div class="pre">${l}</div><div class="v">${v}</div>${d}</div>`).join('');
  }

  function grafico(id, config) {
    if (estado.graficos[id]) estado.graficos[id].destroy();
    if (typeof Chart === 'undefined') return;
    const cor = getComputedStyle(document.body).color;
    Chart.defaults.color = cor;
    Chart.defaults.borderColor = 'rgba(128,128,128,.15)';
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    estado.graficos[id] = new Chart(document.getElementById(id), config);
  }

  function renderEvolucao(lista, { ini, fim }) {
    // Granularidade: hora (dia), dia (semana/mês/≤62 dias), mês (demais)
    let chaves = [], rotulos = [], chaveDe;
    const p = estado.periodo;
    const dias = ini && fim ? (fim - ini) / 864e5 : null;
    if (p === 'dia') {
      for (let h = 0; h < 24; h++) { chaves.push(h); rotulos.push(h + 'h'); }
      chaveDe = d => new Date(d).getHours();
    } else if (dias != null && dias <= 62) {
      for (let d = new Date(ini); d < fim; d.setDate(d.getDate() + 1)) {
        chaves.push(d.toDateString());
        rotulos.push(String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'));
      }
      chaveDe = d => new Date(d).toDateString();
    } else {
      const ts = lista.map(dataRef);
      let a = ini || (ts.length ? new Date(Math.min(...ts)) : new Date());
      let b = fim || (ts.length ? new Date(Math.max(...ts)) : new Date());
      a = new Date(a.getFullYear(), a.getMonth(), 1);
      for (let d = new Date(a); d < b; d.setMonth(d.getMonth() + 1)) {
        chaves.push(d.getFullYear() + '-' + d.getMonth());
        rotulos.push(MESES[d.getMonth()] + '/' + String(d.getFullYear()).slice(2));
      }
      chaveDe = d => { const x = new Date(d); return x.getFullYear() + '-' + x.getMonth(); };
    }
    const idx = {}; chaves.forEach((k, i) => idx[k] = i);
    const res = chaves.map(() => 0), abe = chaves.map(() => 0), can = chaves.map(() => 0);
    lista.forEach(c => {
      const i = idx[chaveDe(dataRef(c))];
      if (i == null) return;
      (resolvido(c) ? res : cancelado(c) ? can : abe)[i]++;
    });
    grafico('g-evolucao', {
      type: 'bar',
      data: { labels: rotulos, datasets: [
        { label: 'Resolvidos', data: res, backgroundColor: COR.verde, borderRadius: 2, stack: 's' },
        { label: 'Em aberto', data: abe, backgroundColor: COR.ouro, borderRadius: 2, stack: 's' },
        { label: 'Cancelados', data: can, backgroundColor: COR.cinza, borderRadius: 2, stack: 's' }
      ] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } },
                 scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false } } } }
    });
  }

  function renderBarras(id, pares, n = 8) {
    const top = pares.slice(0, n), max = top.length ? top[0][1] : 1;
    $('#' + id).innerHTML = top.length ? top.map(([k, v]) =>
      `<div class="lin"><span title="${esc(k)}">${esc(k)}</span><b>${v}</b></div><div class="barra"><i style="width:${100 * v / max}%"></i></div>`).join('')
      : '<div class="vazio">Nenhum chamado no período</div>';
  }

  function renderNotas(lista) {
    const faixa = Array.from({ length: 11 }, (_, i) => i);
    const cont = campo => faixa.map(n => lista.filter(c => c[campo] === n).length);
    grafico('g-notas', {
      type: 'bar',
      data: { labels: faixa.map(String), datasets: [
        { label: 'Atendimento', data: cont('na'), backgroundColor: COR.verde, borderRadius: 2 },
        { label: 'Sistema ERP', data: cont('ns'), backgroundColor: COR.folha, borderRadius: 2 }
      ] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } },
                 scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false }, title: { display: true, text: 'Nota' } } } }
    });
  }

  function renderTabelaClientes(lista) {
    const m = {};
    lista.forEach(c => {
      const k = c.cl || '(sem cliente)';
      const r = m[k] || (m[k] = { cl: k, qt: 0, res: 0, av: 0, na: [], ns: [], sol: {} });
      r.qt++; if (resolvido(c)) r.res++;
      if (c.na != null || c.ns != null) r.av++;
      if (c.na != null) r.na.push(c.na);
      if (c.ns != null) r.ns.push(c.ns);
      if (c.so) r.sol[c.so] = (r.sol[c.so] || 0) + 1;
    });
    const linhas = Object.values(m).sort((a, b) => b.qt - a.qt);
    const nota = v => { const x = media(v); return `<span class="nota ${classeNota(x)}">${fmtMedia(x)}</span>`; };
    $('#t-clientes').innerHTML = `<thead><tr><th>Cliente</th><th class="num">Chamados</th><th class="num">Resolvidos</th>
      <th class="num">Avaliações</th><th class="num">Nota atend.</th><th class="num">Nota sistema</th><th>Quem mais contatou</th></tr></thead><tbody>` +
      (linhas.length ? linhas.map(r => {
        const top = Object.entries(r.sol).sort((a, b) => b[1] - a[1])[0];
        return `<tr><td>${esc(r.cl)}</td><td class="num">${r.qt}</td><td class="num">${r.res}</td><td class="num">${r.av}</td>
          <td class="num">${nota(r.na)}</td><td class="num">${nota(r.ns)}</td><td>${top ? esc(top[0]) + ' (' + top[1] + ')' : ''}</td></tr>`;
      }).join('') : '<tr><td colspan="7" class="vazio">Nenhum chamado no período</td></tr>') + '</tbody>';
  }

  const COLS = [
    ['n', 'Nº'], ['data', 'Data'], ['st', 'Status'], ['cl', 'Cliente'], ['so', 'Solicitante'],
    ['op', 'Operador'], ['as', 'Assunto / classificação'], ['na', 'Nota atend.'], ['ns', 'Nota sist.']
  ];

  function renderTabelaChamados(lista) {
    const { col, dir } = estado.ordem;
    const val = c => col === 'data' ? dataRef(c) : c[col];
    const ord = lista.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      if (x == null || x === '') return 1;
      if (y == null || y === '') return -1;
      return (x > y ? 1 : x < y ? -1 : 0) * dir;
    });
    $('#qtd-chamados').textContent = '(' + lista.length + ')';
    const seta = k => k === col ? (dir > 0 ? ' ▲' : ' ▼') : '';
    const nota = n => n == null ? '' : `<span class="nota ${classeNota(n)}">${n}</span>`;
    $('#t-chamados').innerHTML = '<thead><tr>' + COLS.map(([k, l]) => `<th data-col="${k}">${l}${seta(k)}</th>`).join('') + '</tr></thead><tbody>' +
      (ord.length ? ord.map(c => `<tr data-n="${esc(c.n)}"><td>${esc(c.n)}</td><td>${fmtData(dataRef(c))}</td>
        <td><span class="tag ${classeStatus(c.st)}">${esc(c.st)}</span></td><td>${esc(c.cl)}</td><td>${esc(c.so)}</td>
        <td>${esc(c.op)}</td><td class="quebra">${esc(c.as)}</td><td class="num">${nota(c.na)}</td><td class="num">${nota(c.ns)}</td></tr>`).join('')
        : '<tr><td colspan="9" class="vazio">Nenhum chamado no período</td></tr>') + '</tbody>';
  }

  function renderComentarios(lista) {
    const cs = lista.filter(c => c.co).sort((a, b) => (b.dv || 0) - (a.dv || 0)).slice(0, 30);
    $('#comentarios').innerHTML = cs.length ? cs.map(c => `<div class="coment"><div>${esc(c.co)}</div>
      <div class="meta">${esc(c.n)} · ${esc(c.cl)} · ${esc(c.so)} · ${esc(c.op)} · atendimento ${c.na ?? '–'} / sistema ${c.ns ?? '–'}${c.rc ? ' · ' + esc(c.rc) : ''} · ${fmtData(c.dv)}</div></div>`).join('')
      : '<div class="vazio">Nenhum comentário no período</div>';
  }

  // ---------- Detalhe ----------
  async function abrirDetalhe(numero) {
    $('#modal').hidden = false;
    $('#modal-conteudo').dataset.tela = 'detalhe';
    $('#modal-conteudo').innerHTML = '<p>Carregando chamado ' + esc(numero) + '…</p>';
    try {
      const d = await chamar('getDetalhe', numero);
      const campo = (l, v) => `<div><b>${l}</b>${esc(v) || '–'}</div>`;
      const abas = d.emails.map((e, i) => ({ id: 'e' + i, rotulo: 'Email: ' + e.rotulo })).concat([{ id: 'resumo', rotulo: 'Conversa (texto)' }]);
      $('#modal-conteudo').innerHTML = `
        <h2 style="font-size:18px">Chamado ${esc(d.numero)} <span class="tag ${classeStatus(d.status)}">${esc(d.status)}</span></h2>
        <div>${esc(d.assunto)}</div>
        <div class="det-grid">
          ${campo('Cliente', d.cliente)}${campo('Solicitante', d.solicitante)}${campo('Operador', d.operador)}
          ${campo('Grupo', d.grupo)}${campo('Ação realizada', d.descricaoAcao)}${campo('Abertura', fmtDataHora(d.dataAbertura))}
          ${campo('Resolução', fmtDataHora(d.dataResolucao))}${campo('Avaliação', fmtDataHora(d.dataAvaliacao))}
          ${campo('Nota atendimento', d.notaAtendimento)}${campo('Nota sistema', d.notaSistema)}${campo('Resolvido p/ cliente', d.resolucaoCliente)}
        </div>
        ${d.comentario ? `<div class="coment">${esc(d.comentario)}</div>` : ''}
        <div class="abas seg">${abas.map((a, i) => `<button data-aba="${a.id}" class="${i ? '' : 'ativo'}">${a.rotulo}</button>`).join('')}</div>
        <div data-painel="resumo" ${d.emails.length ? 'hidden' : ''}><pre class="resumo">${esc(d.resumo) || 'Sem resumo.'}</pre></div>
        ${d.emails.map((e, i) => `<div data-painel="e${i}" ${i ? 'hidden' : ''}>
          ${e.erro ? `<p>${esc(e.erro)}</p>` : `
            <div class="sub">${esc(e.assunto)} · ${fmtDataHora(e.data)} · <a href="${esc(e.link)}" target="_blank">abrir no Gmail</a></div>
            <iframe class="email-frame" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>`}
        </div>`).join('')}`;
      d.emails.forEach((e, i) => {
        const f = document.querySelector(`[data-painel="e${i}"] iframe`);
        if (f) f.srcdoc = '<base target="_blank">' + e.html;
      });
      document.querySelectorAll('.abas button').forEach(b => b.onclick = () => {
        document.querySelectorAll('.abas button').forEach(x => x.classList.toggle('ativo', x === b));
        document.querySelectorAll('[data-painel]').forEach(p => p.hidden = p.dataset.painel !== b.dataset.aba);
      });
    } catch (e) {
      $('#modal-conteudo').innerHTML = '<p>Erro: ' + esc(e.message || e) + '</p>';
    }
  }

  // ---------- Relatório ----------
  const mediana = arr => {
    if (!arr.length) return null;
    const s = arr.slice().sort((a, b) => a - b), m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  const pct = (a, b) => b ? Math.round(100 * a / b) : null;
  const fmtPct = v => v == null ? '–' : v + '%';
  const fmtDuracao = h => h == null ? '–' : h < 48 ? fmtMedia(h) + ' h' : fmtMedia(h / 24) + ' dias';
  const horasResolucao = c => c.da && c.dr && c.dr >= c.da ? (c.dr - c.da) / 36e5 : null;
  const indiceMes = d => d.getFullYear() * 12 + d.getMonth();
  const DIAS_SEMANA = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

  // Chave de cada agrupamento: nº do mês/semestre/ano; o grupo k cobre os meses [k*meses, (k+1)*meses)
  const AGRUPAR = {
    mes: { nome: 'mês', plural: 'meses', titulo: 'Mensal', meses: 1, rotulo: k => MESES[k % 12] + '/' + String(Math.floor(k / 12)).slice(2) },
    semestre: { nome: 'semestre', plural: 'semestres', titulo: 'Semestral', meses: 6, rotulo: k => (k % 2 + 1) + 'º sem/' + String(Math.floor(k / 2)).slice(2) },
    ano: { nome: 'ano', plural: 'anos', titulo: 'Anual', meses: 12, rotulo: k => String(k) }
  };

  function resumoGrupo(itens) {
    const av = itens.filter(c => c.na != null || c.ns != null);
    const notas = av.map(c => c.na).filter(v => v != null);
    const comRc = itens.filter(c => c.rc);
    const res = itens.filter(resolvido).length;
    return {
      total: itens.length, resolvidos: res, avaliacoes: av.length,
      na: media(notas), ns: media(av.map(c => c.ns).filter(v => v != null)),
      horas: mediana(itens.map(horasResolucao).filter(v => v != null)),
      taxaAv: pct(av.length, res),
      satisfeitos: pct(notas.filter(n => n >= 9).length, notas.length),
      insatisfeitos: pct(notas.filter(n => n <= 6).length, notas.length),
      rc: pct(comRc.filter(c => /^resolvido/i.test(c.rc)).length, comRc.length)
    };
  }

  // Do primeiro chamado até hoje, incluindo períodos sem chamados. O período em andamento e o primeiro
  // (o histórico começa no meio dele, quando os emails passaram a ser importados) ficam fora das médias.
  function agrupar(lista, g) {
    const ag = AGRUPAR[g], chave = mesIdx => Math.floor(mesIdx / ag.meses);
    const hoje = indiceMes(new Date());
    const ts = lista.map(dataRef);
    const inicio = ts.length ? indiceMes(new Date(Math.min(...ts))) : hoje;
    const grupos = [];
    for (let k = chave(inicio); k <= chave(hoje); k++) {
      const de = Math.max(k * ag.meses, inicio), ate = Math.min((k + 1) * ag.meses - 1, hoje);
      grupos.push({ k, rotulo: ag.rotulo(k), meses: ate - de + 1, parcial: k === chave(inicio) || k === chave(hoje), itens: [] });
    }
    lista.forEach(c => { const gr = grupos[chave(indiceMes(new Date(dataRef(c)))) - chave(inicio)]; if (gr) gr.itens.push(c); });
    return grupos.map(gr => Object.assign(gr, resumoGrupo(gr.itens)));
  }

  // Média de chamados por mês/semestre/ano, só com períodos completos (senão, estimada pela média mensal)
  function mediaChamados(lista, g) {
    const ag = AGRUPAR[g], gs = agrupar(lista, g), comp = gs.filter(x => !x.parcial);
    if (comp.length) return { v: media(comp.map(x => x.total)), d: `${comp.length} ${comp.length > 1 ? ag.plural : ag.nome} completo${comp.length > 1 ? 's' : ''}` };
    if (g === 'mes') return { v: media(gs.map(x => x.total / x.meses)), d: 'nenhum mês completo ainda' };
    return { v: mediaChamados(lista, 'mes').v * ag.meses, d: 'estimativa pela média mensal' };
  }

  function abrirRelatorio(g) {
    const lista = filtrar({ ini: null, fim: null });
    const ag = AGRUPAR[g], grupos = agrupar(lista, g), geral = resumoGrupo(lista);
    const medias = ['mes', 'semestre', 'ano'].map(x => [x, mediaChamados(lista, x)]);
    const volMedio = medias.find(([x]) => x === g)[1].v;
    const campo = { da: 'abertura', dr: 'resolução', dv: 'avaliação' }[estado.campo];

    $('#modal').hidden = false;
    $('#modal-conteudo').dataset.tela = 'relatorio';
    const kpi = (cls, l, v, d) => `<div class="card kpi ${cls}"><div class="pre">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
    const fmtQtd = v => v == null ? '–' : v >= 10 ? String(Math.round(v)) : fmtMedia(v);
    $('#modal-conteudo').innerHTML = `
      <div class="rel-cab">
        <div><div class="pre">Relatório de atendimento</div>
          <h2>Todo o histórico${estado.cliente.trim() ? ' · ' + esc(estado.cliente.trim()) : ''}</h2>
          <div class="sub">${lista.length} chamados · agrupados pela data de ${campo}${estado.busca.trim() ? ' · busca “' + esc(estado.busca.trim()) + '”' : ''}</div></div>
        <div class="btns rel-acoes">
          <div class="seg" id="rel-agrup">${Object.keys(AGRUPAR).map(x => `<button data-g="${x}" class="${x === g ? 'ativo' : ''}">${AGRUPAR[x].titulo}</button>`).join('')}</div>
          <button class="b" id="rel-imprimir">Imprimir / PDF</button>
        </div>
      </div>
      <section class="kpis">
        ${medias.map(([x, m]) => kpi('', 'Chamados por ' + AGRUPAR[x].nome, fmtQtd(m.v), 'média · ' + m.d)).join('')}
        ${kpi('destaque', 'Nota atendimento', fmtMedia(geral.na), `${fmtPct(geral.satisfeitos)} notas 9–10 · ${fmtPct(geral.insatisfeitos)} até 6`)}
        ${kpi('', 'Nota sistema ERP', fmtMedia(geral.ns), 'média de 1 a 10')}
        ${kpi('', 'Tempo de resolução', fmtDuracao(geral.horas), 'mediana, da abertura à resolução')}
        ${kpi('', 'Taxa de avaliação', fmtPct(geral.taxaAv), `${geral.avaliacoes} avaliações de ${geral.resolvidos} resolvidos`)}
        ${kpi('', 'Resolvido p/ cliente', fmtPct(geral.rc), 'segundo a avaliação do cliente')}
      </section>
      <div class="grade-rel">
        <div class="card"><div class="cab"><h2>Chamados por ${ag.nome}</h2><span class="sub">tracejado: média · amarelo: período incompleto</span></div>
          <div class="cc"><div class="cv"><canvas id="gr-volume"></canvas></div></div></div>
        <div class="card"><div class="cab"><h2>Nota média por ${ag.nome}</h2></div>
          <div class="cc"><div class="cv"><canvas id="gr-notas"></canvas></div></div></div>
        <div class="card"><div class="cab"><h2>Satisfação por ${ag.nome}</h2><span class="sub">% das avaliações / dos resolvidos</span></div>
          <div class="cc"><div class="cv"><canvas id="gr-satisfacao"></canvas></div></div></div>
        <div class="card"><div class="cab"><h2>Tempo de resolução por ${ag.nome}</h2><span class="sub">mediana</span></div>
          <div class="cc"><div class="cv"><canvas id="gr-tempo"></canvas></div></div></div>
        <div class="card"><div class="cab"><h2>Aberturas por dia da semana</h2></div>
          <div class="cc"><div class="cv"><canvas id="gr-semana"></canvas></div></div></div>
        <div class="card"><div class="cab"><h2>Aberturas por hora do dia</h2></div>
          <div class="cc"><div class="cv"><canvas id="gr-hora"></canvas></div></div></div>
      </div>
      <section class="card">
        <div class="cab"><h2>Resumo por ${ag.nome}</h2></div>
        <div class="tabela-wrap"><table id="t-relatorio"></table></div>
      </section>`;

    const rotulos = grupos.map(x => x.rotulo + (x.parcial ? '*' : ''));
    const base = { animation: false, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } };
    const linha = (label, data, cor) => ({ type: 'line', label, data, borderColor: cor, backgroundColor: cor, tension: .25, spanGaps: true, pointRadius: 3 });

    grafico('gr-volume', {
      type: 'bar',
      data: { labels: rotulos, datasets: [
        { label: 'Chamados', data: grupos.map(x => x.total), backgroundColor: grupos.map(x => x.parcial ? COR.ouro : COR.verde), borderRadius: 2, order: 2 },
        Object.assign(linha('Média por ' + ag.nome, grupos.map(() => Math.round(10 * volMedio) / 10), COR.cinza), { borderDash: [6, 4], pointRadius: 0, order: 1 })
      ] },
      options: Object.assign({}, base, { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false } } } })
    });
    grafico('gr-notas', {
      type: 'line',
      data: { labels: rotulos, datasets: [linha('Atendimento', grupos.map(x => x.na), COR.verde), linha('Sistema ERP', grupos.map(x => x.ns), COR.folha)] },
      options: Object.assign({}, base, { scales: { y: { min: 0, max: 10 }, x: { grid: { display: false } } } })
    });
    grafico('gr-satisfacao', {
      type: 'line',
      data: { labels: rotulos, datasets: [
        linha('Notas 9–10', grupos.map(x => x.satisfeitos), COR.verde),
        linha('Notas até 6', grupos.map(x => x.insatisfeitos), '#d63939'),
        linha('Taxa de avaliação', grupos.map(x => x.taxaAv), COR.ouro)
      ] },
      options: Object.assign({}, base, { scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, x: { grid: { display: false } } } })
    });
    // Escala em dias quando as resoluções passam de 3 dias
    const emDias = Math.max(0, ...grupos.map(x => x.horas || 0)) > 72;
    grafico('gr-tempo', {
      type: 'bar',
      data: { labels: rotulos, datasets: [{ label: emDias ? 'Dias' : 'Horas', data: grupos.map(x => x.horas == null ? null : Math.round(10 * (emDias ? x.horas / 24 : x.horas)) / 10), backgroundColor: COR.folha, borderRadius: 2 }] },
      options: Object.assign({}, base, { plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, title: { display: true, text: emDias ? 'dias' : 'horas' } }, x: { grid: { display: false } } } })
    });
    const abertos = lista.filter(c => c.da).map(c => new Date(c.da));
    const distribuir = (n, f) => { const a = Array(n).fill(0); abertos.forEach(d => a[f(d)]++); return a; };
    const barras = (id, labels, data) => grafico(id, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Chamados', data, backgroundColor: COR.verde, borderRadius: 2 }] },
      options: Object.assign({}, base, { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { grid: { display: false } } } })
    });
    barras('gr-semana', DIAS_SEMANA, distribuir(7, d => (d.getDay() + 6) % 7));
    barras('gr-hora', Array.from({ length: 24 }, (_, h) => h + 'h'), distribuir(24, d => d.getHours()));

    const nota = v => `<span class="nota ${classeNota(v)}">${fmtMedia(v)}</span>`;
    const porMes = g !== 'mes';
    $('#t-relatorio').innerHTML = `<thead><tr><th>Período</th><th class="num">Chamados</th>${porMes ? '<th class="num">Média/mês</th>' : ''}
      <th class="num">Resolvidos</th><th class="num">Avaliações</th><th class="num">Taxa aval.</th><th class="num">Nota atend.</th>
      <th class="num">Nota sist.</th><th class="num">Notas 9–10</th><th class="num">Resolução</th></tr></thead><tbody>` +
      grupos.slice().reverse().map(x => `<tr class="${x.parcial ? 'parcial' : ''}"><td>${x.rotulo}${x.parcial ? ' <span class="sub">(incompleto)</span>' : ''}</td>
        <td class="num">${x.total}</td>${porMes ? `<td class="num">${fmtMedia(x.total / x.meses)}</td>` : ''}
        <td class="num">${x.resolvidos}</td><td class="num">${x.avaliacoes}</td><td class="num">${fmtPct(x.taxaAv)}</td>
        <td class="num">${nota(x.na)}</td><td class="num">${nota(x.ns)}</td><td class="num">${fmtPct(x.satisfeitos)}</td>
        <td class="num">${fmtDuracao(x.horas)}</td></tr>`).join('') + '</tbody>';

    document.querySelectorAll('#rel-agrup button').forEach(b => b.onclick = () => abrirRelatorio(b.dataset.g));
    $('#rel-imprimir').onclick = () => imprimirRelatorio(g);
  }

  // Impressão sempre no tema claro (fundo escuro some no papel)
  function imprimirRelatorio(g) {
    const escuro = temaEscuro(), tema = raiz.dataset.theme;
    if (escuro) { aplicarTema('light'); abrirRelatorio(g); }
    window.print();
    if (escuro) { aplicarTema(tema); abrirRelatorio(g); }
  }

  // ---------- Operador (quem é o usuário no DeskManager) ----------
  function abrirOperador(r) {
    // Ainda sem resposta do servidor (primeira carga em andamento ou com erro): explica em vez de não fazer nada
    const ops = (r && r.operadores) || [];
    const semOps = !r ? (estado.erroCarga ? 'Não foi possível carregar os seus dados: ' + esc(estado.erroCarga) : 'Carregando os seus dados, aguarde…')
      : (r.importando || !r.ultimaSync) ? 'Importando os seus emails. A lista de operadores aparece aqui assim que terminar (o painel se atualiza sozinho).'
      : 'Nenhum operador encontrado nos seus emails ainda.';
    $('#modal').hidden = false;
    $('#modal-conteudo').dataset.tela = 'operador';
    $('#modal-conteudo').innerHTML = `
      <h2 style="font-size:18px">Seu nome de operador</h2>
      <p>O painel mostra apenas os chamados atendidos por você. Confirme o seu nome como operador no DeskManager:</p>
      ${ops.length ? `<p><select id="op-nome">${ops.map(o => `<option value="${esc(o)}"${o === r.operador ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></p>`
        : `<p class="sub">${semOps}</p>`}
      <div class="acoes">${ops.length ? '<button class="b p" id="op-confirmar">Confirmar</button>' : ''}
        <button class="b" id="op-cancelar">Fechar</button></div>`;
    $('#op-cancelar').onclick = () => $('#modal').hidden = true;
    if (!ops.length) return;
    $('#op-confirmar').onclick = async () => {
      const b = $('#op-confirmar');
      b.disabled = true; b.textContent = 'Salvando…';
      try {
        aplicar(await chamar('definirOperador', $('#op-nome').value));
        $('#modal').hidden = true;
      } catch (e) {
        alert('Erro ao salvar: ' + (e.message || e));
        b.disabled = false; b.textContent = 'Confirmar';
      }
    };
  }

  // ---------- Carga ----------
  function aplicar(r) {
    estado.resposta = r;
    estado.dados = r.chamados;
    $('#status-sync').textContent = (r.ultimaSync ? 'Sincronizado em ' + fmtDataHora(r.ultimaSync) : 'Ainda não sincronizado') +
      (r.importando ? ' · importação em andamento…' : '') +
      (r.pausaCota ? ' · limite diário do Gmail atingido, nova tentativa após ' + fmtDataHora(r.pausaCota) : '');
    $('#status-sync').title = r.chamados.length + ' chamados seus na base';
    $('#btn-operador').textContent = r.operador || 'Definir operador';
    const clientes = [...new Set(estado.dados.map(c => c.cl).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    $('#lista-clientes').innerHTML = clientes.map(c => `<option value="${esc(c)}">`).join('');
    render();
  }

  async function carregar() {
    let r = await chamar('getDados');
    aplicar(r);
    // Primeiro acesso: importa os emails do próprio Gmail (em partes, se forem muitos; o gatilho continua depois).
    // Só uma vez por abertura da página, para não gastar a cota diária do Gmail.
    if (!estado.importouNaCarga && !r.ultimaSync && !r.pausaCota) {
      estado.importouNaCarga = true;
      for (let i = 0; i < 3 && (!r.ultimaSync || r.importando) && !r.pausaCota; i++) {
        $('#status-sync').textContent = 'Importando seus emails…';
        try { await chamar('sincronizarAgora'); } catch (e) { console.warn(e); break; }
        r = await chamar('getDados');
        aplicar(r);
      }
    }
    if (!r.operadorConfirmado) abrirOperador(r);
    acompanharImportacao();
  }

  // Enquanto a importação continua pelo gatilho, relê os dados (só a planilha, sem gastar cota do Gmail)
  function acompanharImportacao() {
    const r = estado.resposta;
    if (!r || (r.ultimaSync && !r.importando)) return;
    setTimeout(async () => {
      try {
        const antes = (r.operadores || []).length;
        const novo = await chamar('getDados');
        aplicar(novo);
        // Operadores apareceram: atualiza a janela de escolha se ela estiver aberta (ou abre, se ainda não confirmado)
        const telaOperador = !$('#modal').hidden && $('#modal-conteudo').dataset.tela === 'operador';
        if (!novo.operadorConfirmado && !antes && (novo.operadores || []).length && ($('#modal').hidden || telaOperador)) abrirOperador(novo);
      } catch (e) { console.warn(e); }
      acompanharImportacao();
    }, 60 * 1000);
  }

  // ---------- Eventos ----------
  document.querySelectorAll('#periodos button').forEach(b => b.onclick = () => {
    estado.periodo = b.dataset.p; render();
  });
  $('#btn-relatorio').onclick = () => abrirRelatorio('mes');
  // Links da barra: rolagem via JS (links com # recarregam a página dentro do Apps Script)
  document.querySelectorAll('.nav .links a').forEach(a => a.onclick = e => {
    e.preventDefault();
    document.querySelectorAll('.nav .links a').forEach(x => x.classList.toggle('on', x === a));
    const alvo = document.getElementById(a.dataset.alvo);
    const y = a.dataset.alvo === 'visao-geral' ? 0 : alvo.getBoundingClientRect().top + window.scrollY - $('.nav').offsetHeight - 12;
    window.scrollTo(0, y);
  });
  $('#btn-tema').onclick = () => {
    const novo = temaEscuro() ? 'light' : 'dark';
    try { localStorage.setItem('painel.tema', novo); } catch (e) { /* sem storage */ }
    aplicarTema(novo);
    render();
  };
  $('#ant').onclick = () => mover(-1);
  $('#prox').onclick = () => mover(1);
  // Só redesenha quando o valor digitado forma uma data completa (ou o campo foi limpo)
  $('#dt-ini').onchange = $('#dt-fim').onchange = e => {
    if (!e.target.value || dataCompleta(e.target.value)) render();
  };
  $('#campo-data').onchange = e => { estado.campo = e.target.value; render(); };
  $('#f-cliente').oninput = e => { estado.cliente = e.target.value; render(); };
  $('#btn-operador').onclick = () => abrirOperador(estado.resposta);
  $('#nivel-classif').onchange = e => { estado.nivel = Number(e.target.value); render(); };
  $('#f-busca').oninput = e => { estado.busca = e.target.value; render(); };
  $('#t-chamados').onclick = e => {
    const th = e.target.closest('th');
    if (th) {
      const col = th.dataset.col;
      estado.ordem = { col, dir: estado.ordem.col === col ? -estado.ordem.dir : -1 };
      return renderTabelaChamados(filtrar());
    }
    const tr = e.target.closest('tr[data-n]');
    if (tr) abrirDetalhe(tr.dataset.n);
  };
  $('#fechar-modal').onclick = () => $('#modal').hidden = true;
  $('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });

  carregar().catch(e => {
    estado.erroCarga = e.message || String(e);
    $('#status-sync').textContent = 'Erro ao carregar: ' + estado.erroCarga;
  });
})();
</script>
