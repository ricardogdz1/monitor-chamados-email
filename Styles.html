<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #1f4d2b; --verde-2: #163a20; --ouro: #f0c21e; --ouro-bg: #fdf3cc; --ouro-txt: #8a6200;
    --bg: #f5f7fb; --card: #fff; --txt: #1d273b; --sub: #667085; --borda: #e3e7ee; --linha: #eef0f4; --cab: #f9fafb;
    --hover: #f1f6f2; --ok: #2f7d32; --ok-bg: #e6f4ea; --ok-txt: #1e6b31; --alerta: #b07800; --ruim: #d63939;
    --neutro-bg: #eef0f4; --barra: #1f4d2b; --b-borda: #d0d5dd; color-scheme: light;
  }
  /* Tema escuro: segue o sistema, a menos que o usuário escolha pelo botão (data-theme) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #11161c; --card: #1a2029; --txt: #e6e9ef; --sub: #97a0b0; --borda: #2a313c; --linha: #232a34; --cab: #1e252f;
    --hover: #1d2a22; --ok: #5cb85f; --ok-bg: #173422; --ok-txt: #7fd48a; --ouro-bg: #3a3012; --ouro-txt: #f0c21e;
    --alerta: #e3b03c; --ruim: #f06262; --neutro-bg: #262d38; --barra: #5cb85f; --b-borda: #2a313c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #11161c; --card: #1a2029; --txt: #e6e9ef; --sub: #97a0b0; --borda: #2a313c; --linha: #232a34; --cab: #1e252f;
    --hover: #1d2a22; --ok: #5cb85f; --ok-bg: #173422; --ok-txt: #7fd48a; --ouro-bg: #3a3012; --ouro-txt: #f0c21e;
    --alerta: #e3b03c; --ruim: #f06262; --neutro-bg: #262d38; --barra: #5cb85f; --b-borda: #2a313c; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.45 Inter, system-ui, "Segoe UI", sans-serif; }
  h1 { margin: 2px 0 0; font-size: 20px; font-weight: 600; }
  h2 { margin: 0; font-size: 14px; font-weight: 600; }
  a { color: inherit; }
  .sub { color: var(--sub); font-size: 12px; font-weight: 400; }
  .pre { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); font-weight: 600; }

  /* Barra superior */
  .nav { background: var(--verde); color: #fff; display: flex; align-items: stretch; gap: 22px; padding: 0 20px;
         min-height: 58px; border-bottom: 3px solid var(--ouro); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
  .marca { display: flex; gap: 12px; align-items: center; margin-right: 10px; font-size: 13px; color: rgba(255,255,255,.75); }
  .marca img { height: 34px; display: block; }
  .marca span { border-left: 1px solid rgba(255,255,255,.3); padding-left: 12px; }
  .nav .links { display: flex; gap: 22px; }
  .nav .links a { color: rgba(255,255,255,.7); font-size: 13px; text-decoration: none; display: flex; align-items: center; }
  .nav .links a:hover, .nav .links a.on { color: #fff; }
  .nav .links a.on { box-shadow: inset 0 -3px var(--ouro); }
  .nav .dir { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: rgba(255,255,255,.65); }
  .nav .dir a, .nav .dir button { color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
         border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; text-decoration: none; }
  .nav .dir a:hover, .nav .dir button:hover { background: rgba(255,255,255,.18); }
  .nav .dir button:disabled { opacity: .6; cursor: wait; }

  .corpo { padding: 20px; max-width: 1440px; margin: 0 auto; }

  /* Cabeçalho do período */
  .topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .b { border: 1px solid var(--b-borda); background: var(--card); color: var(--txt); border-radius: 4px; padding: 7px 12px;
       font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
  .b:hover { border-color: var(--verde); }
  .b:disabled { opacity: .45; cursor: default; border-color: var(--b-borda); }
  .b.p { background: var(--verde); border-color: var(--verde); color: #fff; }
  .b.p:hover { background: var(--verde-2); }

  /* Filtros */
  .filtros { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--card);
             border: 1px solid var(--borda); border-radius: 4px; padding: 10px 14px; margin-bottom: 14px; }
  .seg { display: flex; border: 1px solid var(--borda); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--borda); background: transparent; color: var(--txt);
                padding: 6px 11px; cursor: pointer; font: inherit; font-size: 13px; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--hover); }
  .seg button.ativo { background: var(--verde); color: #fff; }
  label { display: flex; gap: 6px; align-items: center; color: var(--sub); font-size: 12px; }
  input, select { font: inherit; font-size: 13px; color: var(--txt); background: var(--card); border: 1px solid var(--borda);
                  border-radius: 4px; padding: 6px 8px; }
  input:focus, select:focus { outline: 2px solid rgba(31,77,43,.35); border-color: var(--verde); }

  /* Cards */
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 4px; margin-bottom: 14px; min-width: 0; }
  .cab { padding: 12px 16px; border-bottom: 1px solid var(--borda); display: flex; justify-content: space-between;
         align-items: center; gap: 10px; }
  .cab .sub { font-size: 12px; }
  .cab select { padding: 3px 6px; font-size: 12px; }
  .cc { padding: 14px 16px; }
  .vazio { color: var(--sub); text-align: center; padding: 36px 0; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .kpi { padding: 14px 16px; border-top: 3px solid var(--verde); margin: 0; }
  .kpi.destaque { border-top-color: var(--ouro); }
  .kpi .v { font-size: 28px; font-weight: 600; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .kpi .d { font-size: 12px; color: var(--sub); }
  .kpi .d + .d { margin-top: 2px; }
  .up { color: var(--ok); font-weight: 500; } .dn { color: var(--ruim); font-weight: 500; }

  .grade2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
  .grade3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .cv { position: relative; height: 240px; }

  /* Rankings em barras */
  .rank .lin { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-top: 11px; }
  .rank .lin:first-child { margin-top: 0; }
  .rank .lin span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank .barra { height: 6px; background: var(--linha); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .rank .barra i { display: block; height: 100%; background: var(--barra); }

  /* Tabelas */
  .tabela-wrap { overflow: auto; max-height: 560px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--sub); font-weight: 600;
       padding: 9px 16px; background: var(--cab); border-bottom: 1px solid var(--borda); position: sticky; top: 0;
       cursor: pointer; user-select: none; white-space: nowrap; }
  td { padding: 10px 16px; border-bottom: 1px solid var(--linha); font-size: 13px; white-space: nowrap; }
  td.quebra { white-space: normal; min-width: 220px; }
  tbody tr:hover { background: var(--hover); }
  #t-chamados tbody tr { cursor: pointer; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
  .tag.Resolvido { background: var(--ok-bg); color: var(--ok-txt); }
  .tag.Aberto { background: var(--ouro-bg); color: var(--ouro-txt); }
  .tag.Cancelado { background: var(--neutro-bg); color: var(--sub); }
  .nota { font-weight: 600; }
  .nota.boa { color: var(--ok); } .nota.media { color: var(--alerta); } .nota.baixa { color: var(--ruim); }

  /* Comentários */
  .coment { border-left: 3px solid var(--ouro); padding: 4px 12px; margin: 0 0 14px; }
  .coment:last-child { margin-bottom: 0; }
  .coment .meta { color: var(--sub); font-size: 12px; margin-top: 2px; }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(10,20,14,.55); display: flex; align-items: flex-start;
           justify-content: center; padding: 30px 12px; overflow: auto; z-index: 10; }
  .modal-caixa { background: var(--card); border-radius: 4px; border-top: 3px solid var(--verde); padding: 20px;
                 width: min(1000px, 100%); position: relative; }
  .fechar { position: absolute; right: 12px; top: 8px; border: 0; background: none; font-size: 28px; cursor: pointer; color: var(--sub); }
  .modal-caixa h2 { font-size: 18px; margin-bottom: 8px; }
  .modal-caixa p { margin: 8px 0; }
  .acoes { display: flex; gap: 8px; margin-top: 14px; }
  .det-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 16px; margin: 12px 0; }
  .det-grid div b { display: block; color: var(--sub); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .email-frame { width: 100%; height: 520px; border: 1px solid var(--borda); border-radius: 4px; background: #fff; }
  .abas { margin: 14px 0 8px; flex-wrap: wrap; display: inline-flex; }
  pre.resumo { white-space: pre-wrap; background: var(--bg); padding: 10px; border-radius: 4px; max-height: 520px; overflow: auto; }

  @media (max-width: 1100px) { .grade3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 800px) {
    .corpo { padding: 12px; }
    .grade2, .grade3 { grid-template-columns: 1fr; }
    .nav { position: static; gap: 14px; padding: 8px 12px; }
    .nav .links { gap: 14px; }
    .nav .dir { margin-left: 0; }
  }
</style>
